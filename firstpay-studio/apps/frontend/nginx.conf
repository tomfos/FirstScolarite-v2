server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Assets au nom hashé par le build (contenu immuable) → cache long.
  location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA : toutes les routes retombent sur index.html.
  # index.html n'est JAMAIS mis en cache dur → chaque redéploiement est vu
  # immédiatement (revalidation ETag/304, sans re-télécharger les bundles).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Proxy API vers la gateway (conserve le préfixe /api)
  location /api/ {
    proxy_pass http://api-gateway:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;          # nécessaire pour SSE
  }

  # Webhooks TrustPayWay (si le nginx hôte envoie tout le trafic vers ce conteneur)
  location /webhooks/ {
    proxy_pass http://api-gateway:8080/webhooks/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
