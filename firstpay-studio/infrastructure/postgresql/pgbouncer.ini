[databases]
firstpay = host=postgres port=5432 dbname=firstpay pool_size=100

[pgbouncer]
; mode transaction pour haute perf (PgBouncer)
pool_mode = transaction
max_client_conn = 5000
default_pool_size = 100
reserve_pool_size = 20
; Plafond DUR de connexions serveur vers postgres : reste sous max_connections=300
; (marge pour flyway sur 5432, superuser réservé, monitoring). Empêche le
; "too many clients" observé sous burst.
max_db_connections = 250
; Libère les connexions serveur inactives 2 min après un pic (au lieu de 10 min).
server_idle_timeout = 120
; INDISPENSABLE en pool_mode=transaction avec r2dbc-postgresql : le driver utilise
; le protocole étendu (prepared statements nommés, réutilisés d'une transaction à
; l'autre). Sans ce réglage, une transaction rejouée sur une AUTRE connexion serveur
; échoue ("prepared statement S_x does not exist"). pgbouncer (≥1.21) suit et rejoue
; les Parse de façon transparente. Fixe le cache par connexion cliente.
max_prepared_statements = 256
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
ignore_startup_parameters = extra_float_digits
