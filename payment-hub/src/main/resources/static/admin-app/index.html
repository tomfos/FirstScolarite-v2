<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment Hub — Console</title>
  <style>
    :root { --brand:#E53935; --bg:#f4f5f7; --card:#fff; --ink:#1f2430; --muted:#7c8493; --line:#e7e9ee; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
    header { background:#0f1115; color:#fff; padding:14px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    header h1 { font-size:16px; margin:0; }
    header .sp { flex:1; }
    header input { padding:8px 10px; border-radius:8px; border:1px solid #333; background:#1b1e26; color:#fff; min-width:220px; }
    .wrap { max-width:1000px; margin:0 auto; padding:20px 16px 60px; }
    .tabs { display:flex; gap:6px; margin:16px 0; flex-wrap:wrap; }
    .tab { padding:8px 14px; border-radius:20px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:14px; }
    .tab.on { background:var(--brand); color:#fff; border-color:var(--brand); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; }
    button { padding:8px 12px; border-radius:8px; border:0; background:var(--brand); color:#fff; cursor:pointer; font-size:14px; }
    button.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
    input,select,textarea { padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:inherit; }
    label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
    .pill { padding:2px 8px; border-radius:10px; font-size:12px; font-weight:600; }
    .ok { background:#e6f4ea; color:#137333; } .off { background:#fce8e6; color:#c5221f; }
    .muted { color:var(--muted); font-size:13px; }
    code { background:#f0f1f4; padding:2px 6px; border-radius:5px; font-size:13px; word-break:break-all; }
    .hidden { display:none; }
    .toggle { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  </style>
</head>
<body>
  <header>
    <h1>🏦 Payment Hub — Console</h1>
    <span class="sp"></span>
    <input id="token" placeholder="X-Admin-Token" />
    <button class="ghost" onclick="App.saveToken()">Connecter</button>
  </header>
  <div class="wrap">
    <div class="tabs">
      <div class="tab on" data-t="apps" onclick="App.tab('apps')">Applications</div>
      <div class="tab" data-t="providers" onclick="App.tab('providers')">Providers</div>
      <div class="tab" data-t="methods" onclick="App.tab('methods')">Moyens par application</div>
      <div class="tab" data-t="payments" onclick="App.tab('payments')">Paiements</div>
    </div>
    <div id="view"></div>
  </div>
  <script src="/admin-app/app.js"></script>
</body>
</html>
