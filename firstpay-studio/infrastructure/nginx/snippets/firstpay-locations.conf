# Cash collect First — locations proxy partagées (inclus par les blocs HTTP et HTTPS).
# Généré/déployé par setup-nginx-production.sh. Ne pas éditer sur le serveur.
#
# Prérequis dans le server{} incluant ce fichier :
#   - upstreams firstpay_gateway / firstpay_frontend / firstpay_payer définis
#   - map $http_upgrade $connection_upgrade { ... } défini

client_max_body_size 25m;

location ^~ /webhooks/ {
    proxy_pass http://firstpay_gateway;
    include /etc/nginx/snippets/firstpay-proxy.conf;
    proxy_read_timeout 60s;
}

location ^~ /api/ {
    proxy_pass http://firstpay_gateway;
    include /etc/nginx/snippets/firstpay-proxy.conf;
    proxy_buffering off;
    proxy_read_timeout 300s;
}

# API publique (résolution directe gateway — secours si page payeur indisponible)
location ^~ /public/ {
    proxy_pass http://firstpay_gateway;
    include /etc/nginx/snippets/firstpay-proxy.conf;
    proxy_buffering off;
}

location = /swagger-ui { return 302 /swagger-ui.html; }

location ^~ /swagger-ui {
    proxy_pass http://firstpay_gateway;
    include /etc/nginx/snippets/firstpay-proxy.conf;
}

location ^~ /v3/api-docs {
    proxy_pass http://firstpay_gateway;
    include /etc/nginx/snippets/firstpay-proxy.conf;
}

location ^~ /webjars {
    proxy_pass http://firstpay_gateway;
    include /etc/nginx/snippets/firstpay-proxy.conf;
}

# Routes du portail Angular (authGuard)
location ~ ^/(login|home|studio|transactions|users|settings|admin_home|partners|transactions_all|audit|settings_platform|cashier|cashier_history)(/|$) {
    proxy_pass http://firstpay_frontend;
    include /etc/nginx/snippets/firstpay-proxy.conf;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
}

# Script de la page payeur (asset au root : /app.js) — servi par le conteneur payeur.
# Le portail Angular n'utilise que des bundles hashés (main-XXXX.js), jamais /app.js.
location = /app.js {
    proxy_pass http://firstpay_payer;
    include /etc/nginx/snippets/firstpay-proxy.conf;
}
location = /gsap.min.js {
    proxy_pass http://firstpay_payer;
    include /etc/nginx/snippets/firstpay-proxy.conf;
}

# Page payeur publique : /{shortCode}/{slug}
location ~ ^/[A-Za-z0-9_-]+/[a-z0-9][a-z0-9_-]*/?$ {
    proxy_pass http://firstpay_payer;
    include /etc/nginx/snippets/firstpay-proxy.conf;
}

location = / {
    proxy_pass http://firstpay_frontend;
    include /etc/nginx/snippets/firstpay-proxy.conf;
}

location / {
    proxy_pass http://firstpay_frontend;
    include /etc/nginx/snippets/firstpay-proxy.conf;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
}
