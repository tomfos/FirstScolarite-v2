spring:
  application:
    name: payment-hub

  # Persistance réactive (chemin chaud) — R2DBC
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/payhub}
    username: ${DB_USER:payhub}
    password: ${DB_PASSWORD:payhub}
    pool:
      initial-size: 10
      max-size: 50
      max-idle-time: 30m

  # Migrations — Flyway s'exécute en JDBC sur la même base
  flyway:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/payhub}
    user: ${DB_USER:payhub}
    password: ${DB_PASSWORD:payhub}
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 1000ms

  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8090}
  shutdown: graceful

payhub:
  # Clé de chiffrement AES (Base64, 16/24/32 octets) des credentials providers en base.
  # OBLIGATOIRE en production — générer avec : openssl rand -base64 32
  crypto:
    secret: ${PAYHUB_CRYPTO_SECRET:ZGV2LW9ubHktY2hhbmdlLW1lLTMyLWJ5dGVzLWtleSE=}
  # URL publique de base du Hub (checkout hébergé + webhooks entrants PSP).
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8090}
  # Jeton du back-office admin (en-tête X-Admin-Token). Vide = contrôle désactivé (dev only).
  admin:
    token: ${PAYHUB_ADMIN_TOKEN:dev-admin-token}
  payment:
    # Simulation activée tant qu'aucun provider réel n'est configuré (dev).
    simulation-enabled: ${PAYMENT_SIMULATION_ENABLED:true}
    reconcile-interval-ms: ${PAYMENT_RECONCILE_MS:30000}

# Un circuit breaker + bulkhead + time limiter par connecteur : isole la panne d'un PSP.
resilience4j:
  circuitbreaker:
    configs:
      default: { failure-rate-threshold: 50, wait-duration-in-open-state: 10s, sliding-window-size: 50, permitted-number-of-calls-in-half-open-state: 5 }
    instances:
      trustpayway-connector: { base-config: default }
      mpgs-connector: { base-config: default }
      sara-connector: { base-config: default }
      transfer-connector: { base-config: default }
  bulkhead:
    configs:
      default: { max-concurrent-calls: 100, max-wait-duration: 20ms }
    instances:
      trustpayway-connector: { base-config: default }
      mpgs-connector: { base-config: default }
      sara-connector: { base-config: default }
      transfer-connector: { base-config: default }
  timelimiter:
    configs:
      default: { timeout-duration: 8s, cancel-running-future: true }
    instances:
      trustpayway-connector: { base-config: default }
      mpgs-connector: { base-config: default }
      sara-connector: { base-config: default }
      transfer-connector: { base-config: default }

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /docs
